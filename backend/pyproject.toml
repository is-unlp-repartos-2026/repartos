[project]
name = "repartos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lucianosoto", email = "sotoluciano.556611@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.5",
]


[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "repartos.main:app"

[tool.pytest.ini_options]
# Dónde están los tests. Se corren desde backend/ con: uv run pytest
testpaths = ["tests"]
